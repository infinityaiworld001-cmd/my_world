<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>World of Mysteries - Episode 24: War End</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar">
    <div class="nav-container">
        <a href="{{ url_for('home') }}" class="logo">
            World of <span>Mysteries</span>
        </a>

        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('chapters') }}">Chapters</a>
        </div>
    </div>
</nav>

<header class="page-header">
    <h1>Episode 24</h1>
    <p>War End</p>
</header>

<section class="section">

    <div class="section-title">
        <span>WORLD OF MYSTERIES</span>
        <h2>War End</h2>
        <p>Page {{ page }} / {{ total_pages }}</p>
    </div>

    <div class="manga-reader">
        <img src="{{ url_for('static',
        filename='images/manga/episode24/page' ~ page ~ '.png') }}"
        alt="Episode 24 Page {{ page }}">
    </div>

    <div class="manga-buttons">

        {% if page > 1 %}
        <a href="{{ url_for('manga_episode24', page=page-1) }}" class="btn secondary">
            ⬅ Previous
        </a>
        {% endif %}

        {% if page < total_pages %}
        <a href="{{ url_for('manga_episode24', page=page+1) }}" class="btn">
            Next ➜
        </a>
        {% else %}
        <a href="{{ url_for('chapters') }}" class="btn">
            Finish Episode
        </a>
        {% endif %}

    </div>

</section>

<footer class="footer">
    <p>© 2026 <span>World of Mysteries</span> | Episode 24: War End</p>
</footer>

</body>
</html>
